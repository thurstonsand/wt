min_version = "2026.7.4"

[settings]
idiomatic_version_file_enable_tools = ["go"]

[env]
HK_MISE = "1"

[hooks]
enter = "mise install --quiet"
postinstall = "npm --prefix plugins/pi ci --ignore-scripts --quiet && hk install --mise --quiet"

[tools]
golangci-lint = "2.12.2"
hk = "1.50.0"
node = "24"
"npm:markdownlint-cli2" = "0.18.0"

[tasks.check-versions]
description = "Check tool version files for consistency"
run = '''
go_mod_version="$(awk '/^go [0-9]/ {print $2; exit}' go.mod)"
go_version="$(tr -d '[:space:]' < .go-version)"
if [ "$go_mod_version" != "$go_version" ]; then
  echo "wt: go.mod ($go_mod_version) and .go-version ($go_version) disagree — sync them" >&2
fi
'''

[tasks.build]
description = "Build binary to bin/wt"
run = "go build -o bin/wt ."

[tasks.test]
description = "Run unit tests"
run = [
    "go test -v ./...",
    "npm --prefix plugins/pi test",
]

[tasks.test-int]
description = "Run unit+integration tests"
run = [
    "go test -tags=integration -v ./...",
    "npm --prefix plugins/pi test",
]

[tasks.test-coverage]
description = "Generate coverage.html"
run = [
    "go test -tags=integration -coverprofile=coverage.out ./...",
    "go tool cover -html=coverage.out -o coverage.html",
]

[tasks.lint]
description = "Run Go, Markdown, and pi extension checks"
depends = ["check-versions"]
run = [
    "go mod tidy -diff",
    "golangci-lint run ./...",
    "markdownlint-cli2",
    "npm --prefix plugins/pi run lint",
    "npm --prefix plugins/pi run typecheck",
]

[tasks.lint-fix]
description = "Auto-fix lint issues"
run = [
    "go mod tidy",
    "golangci-lint run --fix ./...",
    "markdownlint-cli2 --fix",
    "npm --prefix plugins/pi run format",
]

[tasks.wt]
description = "Run wt with arguments: mise run wt -- --version"
run = "go run ."

[tasks.clean]
description = "Remove bin/ and coverage artifacts"
run = "rm -rf bin/ coverage.out coverage.html"

[tasks.install]
description = "Build and copy to GOPATH/bin"
depends = ["build"]
run = "cp bin/wt $(go env GOPATH)/bin/"

[tasks.update-deps]
description = "Upgrade Go modules and pinned tools, refreshing both lockfiles"
run = [
    "go get -u ./...",
    "go mod tidy",
    "mise upgrade --bump",
    "mise lock",
]
