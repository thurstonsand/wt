min_version = "2026.7.4"

[env]
HK_MISE = "1"

[hooks]
enter = "mise bootstrap --yes --quiet"

[tools]
go = "1.27.3"
golangci-lint = "2.15.0"
goreleaser = "2.19.0"
hk = "2.10.0"
# hk's check and fix hooks run jactionlint, which runs shellcheck over every `run:` script. Renovate
# does not know mise's `jactionlint` shorthand, so the backend is spelled out.
"aqua:jdx/jactionlint" = "2.4.0"
shellcheck = "0.11.0"
node = "26"
"npm:markdownlint-cli2" = "0.24.0"

[tasks.bootstrap]
description = "Install pi dependencies and git hooks"
run = [
    "npm --prefix plugins/pi ci --ignore-scripts --quiet --no-fund --no-audit",
    "hk install --mise --quiet",
]
sources = [
    "mise.toml",
    "hk.pkl",
    "plugins/pi/package.json",
    "plugins/pi/package-lock.json",
]
outputs = { auto = true }
quiet = true

[tasks."lint:versions"]
description = "Check tool version files for consistency"
run = '''
status=0

# go.mod states the oldest Go that can build wt; mise.toml states the one that does.
# They are allowed to differ, but the toolchain may never be older than the floor.
go_mod_version="$(awk '/^go [0-9]/ {print $2; exit}' go.mod)"
toolchain_version="$(awk '/^go = / {gsub(/"/, "", $3); print $3; exit}' mise.toml)"
if [ -z "$toolchain_version" ]; then
  echo "wt: mise.toml declares no Go toolchain, so builds fall back to whatever is on PATH" >&2
  status=1
elif [ "$(printf '%s\n%s\n' "$go_mod_version" "$toolchain_version" | sort -V | head -1)" != "$go_mod_version" ]; then
  echo "wt: mise.toml builds with Go $toolchain_version, older than the $go_mod_version floor in go.mod" >&2
  status=1
fi

changelog_version="$(sed -n 's/^## v\([0-9][0-9.]*\)$/\1/p' CHANGELOG.md | head -1)"
plugin_version="$(sed -n 's/^  "version": "\([^"]*\)",$/\1/p' plugins/wt/.claude-plugin/plugin.json)"
if [ "$plugin_version" != "$changelog_version" ]; then
  echo "wt: plugin.json ($plugin_version) and CHANGELOG.md ($changelog_version) disagree — bump plugins/wt/.claude-plugin/plugin.json" >&2
  status=1
fi

exit "$status"
'''

[tasks.build]
description = "Build binary to bin/wt"
run = "go build -o bin/wt ."

[tasks.test]
description = "Run unit tests"
run = [
    "go test -v ./...",
    "npm --prefix plugins/pi test",
]

[tasks."test:int"]
description = "Run unit+integration tests"
run = [
    "go test -tags=integration -v ./...",
    "npm --prefix plugins/pi test",
]

[tasks."test:coverage"]
description = "Generate coverage.html"
run = [
    "go test -tags=integration -coverprofile=coverage.out ./...",
    "go tool cover -html=coverage.out -o coverage.html",
]

[tasks.lint]
description = "Run Go, Markdown, and pi extension checks"
depends = ["lint:*"]

[tasks."lint:go"]
description = "Lint Go sources and verify go.mod is tidy"
run = ["go mod tidy -diff", "golangci-lint run ./..."]

[tasks."lint:actions"]
description = "Lint GitHub Actions workflows"
run = "hk check --all --step jactionlint"

# Renovate supports only Node 24 (its engines say ^24.11), so its tasks pin 24 while the rest of
# the repo develops on 26. Its bin shim also ends in `exec node`, and mise builds a task's PATH from
# the shell's pre-activation ordering, which on a Homebrew machine starts at /opt/homebrew/bin -- ahead of the
# node this task declares. re2 is then compiled by mise's node and loaded by Homebrew's, which
# fails the ABI check and downgrades regex validation to JavaScript RegExp with only a warning.
# `{{ tools.node.path }}` would name the repo's Node 26, not this task's 24, hence `mise where`.
[tasks."lint:renovate"]
description = "Validate dependency update configuration"
run = "PATH=\"$(mise where node@24)/bin:$PATH\" renovate-config-validator"
tools.node = "24"
tools."npm:renovate" = { version = "44.198.2", allow_builds = [
  "re2",
], trust_policy_excludes = [
  "@yarnpkg/libzip@3.2.2",
] }

[tasks.renovate]
description = "Run Renovate"
run = "PATH=\"$(mise where node@24)/bin:$PATH\" renovate"
tools.node = "24"
tools."npm:renovate" = { version = "44.198.2", allow_builds = [
  "re2",
], trust_policy_excludes = [
  "@yarnpkg/libzip@3.2.2",
] }

# Biome is installed in plugins/pi, but its config sits at the repo root: since 2.6.4, Biome
# ignores markdown.parser.frontmatter for files outside the config's directory, and would then
# format every SKILL.md's YAML frontmatter as Markdown.
[tasks."lint:markdown"]
description = "Lint and format-check Markdown"
run = [
    "markdownlint-cli2",
    "cd plugins/pi && npx biome check $(git ls-files --cached --others --exclude-standard ':/*.md')",
]

[tasks."lint:pi"]
description = "Lint and type-check the pi extension"
run = [
    "npm --prefix plugins/pi run lint",
    "npm --prefix plugins/pi run typecheck",
]

# Deliberately outside the `lint:` group: `lint` expands `lint:*`, and the fixer rewrites files.
[tasks.fix]
description = "Auto-fix lint and formatting issues"
run = [
    "go mod tidy",
    "golangci-lint run --fix ./...",
    "hk fix --all --step jactionlint",
    "markdownlint-cli2 --fix",
    "npm --prefix plugins/pi run format",
    "cd plugins/pi && npx biome format --write $(git ls-files --cached --others --exclude-standard ':/*.md')",
]

[tasks.wt]
description = "Run wt with arguments: mise run wt -- --version"
run = "go run ."

[tasks.release-check]
description = "Validate release configuration and artifacts"
run = [
    "goreleaser check",
    "goreleaser release --snapshot --clean",
    "cd plugins/pi && npm pack --dry-run",
]

[tasks.clean]
description = "Remove build and coverage artifacts"
run = "rm -rf bin/ dist/ coverage.out coverage.html"

[tasks.install]
description = "Build and copy to GOPATH/bin"
depends = ["build"]
run = "cp bin/wt $(go env GOPATH)/bin/"

[tasks.update-deps]
description = "Upgrade Go modules and pinned tools, refreshing both lockfiles"
run = [
    "go get -u ./...",
    "go mod tidy",
    "mise upgrade --bump",
    "mise lock",
]
