name: CI

on:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: Lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up mise
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          minimum_release_age: 3d
          auto_update: true
          install: true
          cache: true

      - name: Bootstrap
        run: mise run bootstrap

      - name: Check
        run: mise run check

      - name: Test
        run: mise run test:int

      - name: Check npm package
        working-directory: plugins/pi
        run: npm pack --dry-run
