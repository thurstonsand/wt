name: CI

on:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: Lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up mise
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install: true
          cache: true

      - name: Bootstrap
        run: mise run bootstrap

      - name: Lint
        run: mise run lint

      - name: Test
        run: mise run test:int

      - name: Check npm package
        working-directory: plugins/pi
        run: npm pack --dry-run
