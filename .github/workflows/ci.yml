name: CI

on:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up mise
        uses: jdx/mise-action@v4
        with:
          install: true
          cache: true

      - name: Bootstrap
        run: mise run bootstrap

      - name: Lint
        run: mise run lint

      - name: Test
        run: mise run test:int

      - name: Check npm package
        working-directory: plugins/pi
        run: npm pack --dry-run
