name: Refresh Renovate mise lockfile

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - hk.pkl
      - mise.toml

permissions:
  contents: write

concurrency:
  group: renovate-mise-lock-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  refresh:
    name: Refresh mise.lock
    if: >-
      github.actor == 'renovate[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Renovate branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up mise
        uses: jdx/mise-action@v4
        with:
          install: false
          cache: false

      - name: Refresh lockfile
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mise trust
          mise lock

      - name: Commit lockfile
        run: |
          if git diff --quiet -- mise.lock; then
            exit 0
          fi
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR_ID+$GITHUB_ACTOR@users.noreply.github.com"
          git add mise.lock
          git commit -m "chore(deps): refresh mise lockfile"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
