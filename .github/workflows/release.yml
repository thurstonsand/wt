name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify versions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the tag, the versions and the changelog agree
        run: scripts/check-changelog.sh "$GITHUB_REF_NAME"

  ci:
    name: CI
    needs: verify
    uses: ./.github/workflows/ci.yml

  publish-release:
    name: Publish binaries
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
      GITHUB_TOKEN: ${{ github.token }}
      MACOS_SIGN_P12: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_BASE64 }}
      MACOS_SIGN_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
      MACOS_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
      MACOS_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up mise
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install: true
          cache: false

      - name: Validate release secrets
        run: |
          test -n "$MACOS_SIGN_P12"
          test -n "$MACOS_SIGN_PASSWORD"
          test -n "$MACOS_NOTARY_KEY_ID"
          test -n "$MACOS_NOTARY_ISSUER_ID"
          test -n "$APPLE_NOTARY_KEY"

      - name: Write notarization key
        run: |
          key_path="$RUNNER_TEMP/notary-key.p8"
          printf '%s' "$APPLE_NOTARY_KEY" > "$key_path"
          chmod 600 "$key_path"
          echo "MACOS_NOTARY_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      - name: Prepare release notes
        run: scripts/extract-release-notes.sh "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes.md"

      - name: Publish release
        run: goreleaser release --clean --release-notes "$RUNNER_TEMP/release-notes.md"

      - name: Upload Homebrew cask
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: homebrew-cask
          path: dist/homebrew/Casks/wt.rb
          if-no-files-found: error
          retention-days: 7

  update-homebrew-tap:
    name: Update Homebrew Tap
    needs: publish-release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download cask
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: homebrew-cask
          path: dist

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@c262868c096d909fc278daa87ed9772967331ea3 # 2026.11.02.1

      - name: Checkout Homebrew tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: thurstonsand/homebrew-tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_PRIVATE_KEY }}
          path: homebrew-tap

      - name: Update cask
        run: |
          set -euo pipefail

          cp dist/wt.rb homebrew-tap/Casks/wt.rb
          # GoReleaser orders stanzas its own way; --fix rewrites them in Homebrew's order and still
          # fails on anything it cannot correct.
          brew style --fix homebrew-tap/Casks/wt.rb

      - name: Commit cask update
        working-directory: homebrew-tap
        run: |
          set -euo pipefail

          if git diff --quiet -- Casks; then
            echo "Cask is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks
          git commit -m "wt ${GITHUB_REF_NAME#v}"

          # brew audit reads casks from a tap, so audit the commit about to be pushed through one.
          brew tap thurstonsand/tap "$PWD"
          brew trust thurstonsand/tap
          brew audit --strict --cask thurstonsand/tap/wt

          git pull --rebase --quiet
          git push

  publish-npm:
    name: Publish @thurstonsand/pi-wt
    needs: [ci, publish-release]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: npm
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: plugins/pi
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Check package
        run: npm pack --dry-run

      - name: Publish package
        run: npm publish --access public
